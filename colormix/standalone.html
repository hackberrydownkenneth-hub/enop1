<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="美容師向け。合計量と2剤の倍率を入れるだけで、1剤それぞれのグラム数を自動計算します。日本語・廣東話対応。"
    />
    <title>カラー剤 計算機</title>
    <style>
/* カラー剤計算機 — スマホ片手で使える大きめUI */
:root {
  --bg: #f6f4f9;
  --card: #ffffff;
  --ink: #241f2e;
  --muted: #6f6880;
  --line: #e4e0ec;
  --brand: #7c3aed;
  --brand-ink: #ffffff;
  --brand-soft: #f0e9ff;
  --ox: #0d9488;
  --ox-soft: #e2f6f3;
  --warn: #b45309;
  --danger: #d02f4b;
  --badge-ink: #7c3aed;
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP",
    system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
  --shadow: 0 2px 10px rgba(36, 31, 46, 0.07);
}

/* 端末がダークモード（テーマ未指定のとき） */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141d;
    --card: #221e2b;
    --ink: #f3f0f8;
    --muted: #a9a1b8;
    --line: #362f45;
    --brand: #a78bfa;
    --brand-ink: #1b1524;
    --brand-soft: #2e2540;
    --ox: #5eead4;
    --ox-soft: #1e3a37;
    --warn: #fbbf24;
    --danger: #fb7185;
    --badge-ink: #f3f0f8;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }
}

/* テーマを明示的にダーク指定されたとき */
:root[data-theme="dark"] {
  --bg: #17141d;
  --card: #221e2b;
  --ink: #f3f0f8;
  --muted: #a9a1b8;
  --line: #362f45;
  --brand: #a78bfa;
  --brand-ink: #1b1524;
  --brand-soft: #2e2540;
  --ox: #5eead4;
  --ox-soft: #1e3a37;
  --warn: #fbbf24;
  --danger: #fb7185;
  --badge-ink: #f3f0f8;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
}

/* 広東語（繁体字）表示のときは中文フォントを優先する */
:root[lang^="yue"],
:root[lang^="zh"] {
  --font: "PingFang HK", "Noto Sans HK", "Noto Sans TC", "Hiragino Sans CNS",
    "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

/* display を持つクラス（.sticky-bar / .gate-field など）に hidden 属性を効かせる */
[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0 0 96px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
}

.header {
  padding: 20px 16px 14px;
  background: var(--brand);
  color: var(--brand-ink);
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 0.02em;
}

.header p {
  margin: 4px 0 0;
  font-size: 13px;
  opacity: 0.9;
}

.lang {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

.lang-btn {
  min-height: 34px;
  padding: 4px 16px;
  border: 2px solid var(--brand-ink);
  border-radius: 999px;
  background: transparent;
  color: var(--brand-ink);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  opacity: 0.75;
  cursor: pointer;
}

.lang-btn[aria-pressed="true"] {
  background: var(--brand-ink);
  color: var(--brand);
  opacity: 1;
}

.lang-btn:focus-visible {
  outline: 3px solid var(--brand-ink);
  outline-offset: 2px;
}

.main {
  max-width: 620px;
  margin: 0 auto;
  padding: 14px 12px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* タブ */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tab {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 8px;
  min-height: 60px;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}

.tab strong {
  font-size: 15px;
}

.tab small {
  font-size: 11px;
}

.tab[aria-selected="true"] {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--ink);
}

/* カード */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
}

.step {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font-size: 17px;
}

.step-no {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: var(--brand);
  color: var(--brand-ink);
  font-size: 14px;
  font-weight: 700;
}

.hint {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 13px;
}

/* チップ（プリセットボタン） */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  flex: 1 1 auto;
  min-width: 72px;
  min-height: 52px;
  padding: 6px 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.chip[aria-pressed="true"] {
  border-color: var(--brand);
  background: var(--brand);
  color: var(--brand-ink);
}

/* 入力まわり */
.custom-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.custom-row label {
  color: var(--muted);
  font-size: 13px;
}

.stepper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.round {
  width: 46px;
  height: 46px;
  flex: none;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--ink);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.round:active {
  background: var(--brand-soft);
}

.num-input {
  width: 88px;
  height: 46px;
  padding: 0 8px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
}

.num-input.big {
  width: 104px;
  font-size: 24px;
}

.num-input:focus,
.text-input:focus,
.chip:focus-visible,
.round:focus-visible,
.tab:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.unit {
  color: var(--muted);
  font-size: 15px;
}

.ratio-view {
  margin: 12px 0 0;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  text-align: center;
  font-size: 15px;
  color: var(--muted);
}

.ratio-view b {
  color: var(--ink);
  font-size: 20px;
}

/* 1剤の行 */
.item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}

.item:first-child {
  padding-top: 0;
}

.text-input {
  width: 100%;
  height: 46px;
  padding: 0 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
}

.item-controls {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.item-controls .label {
  color: var(--muted);
  font-size: 13px;
  flex: none;
}

.item-badge {
  margin-left: auto;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--badge-ink);
  font-size: 20px;
  font-weight: 800;
  white-space: nowrap;
}

.del-btn {
  width: 42px;
  height: 42px;
  flex: none;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--danger);
  font-size: 18px;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  min-height: 50px;
  margin-top: 12px;
  border: 2px dashed var(--brand);
  border-radius: 12px;
  background: transparent;
  color: var(--brand);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

/* 結果 */
.result {
  border: 2px solid var(--brand);
}

.result-title {
  margin: 0 0 10px;
  font-size: 15px;
  color: var(--muted);
  font-weight: 700;
}

.rrow {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.rrow .rname {
  font-size: 16px;
  overflow-wrap: anywhere;
}

.rrow .rname small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.rrow .rgram {
  flex: none;
  font-size: 34px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.rrow .rgram span {
  font-size: 15px;
  font-weight: 700;
  margin-left: 2px;
}

.rrow.ox {
  background: var(--ox-soft);
  margin: 6px -14px 0;
  padding: 12px 14px;
  border-bottom: none;
  border-radius: 12px;
  color: var(--ox);
}

.rrow.sum {
  border-bottom: none;
  padding-top: 12px;
  color: var(--muted);
}

.rrow.sum .rgram {
  font-size: 24px;
  color: var(--ink);
}

.subtotal {
  margin: 8px 0 0;
  text-align: right;
  color: var(--muted);
  font-size: 13px;
}

.notice {
  margin: 10px 0 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--brand-soft);
  color: var(--warn);
  font-size: 13px;
}

.error {
  margin: 0;
  padding: 14px;
  border-radius: 12px;
  background: var(--brand-soft);
  color: var(--danger);
  font-weight: 700;
  text-align: center;
}

.steps-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 13px;
  color: var(--muted);
}

.steps-toggle .chip {
  min-width: 0;
  min-height: 38px;
  padding: 2px 12px;
  font-size: 14px;
}

/* 操作ボタン */
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.action {
  min-height: 48px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.action:active {
  background: var(--brand-soft);
}

/* 保存レシピ */
.recipe {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
}

.recipe-load {
  flex: 1;
  min-height: 44px;
  padding: 6px 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.recipe-load small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* つかいかた */
.how summary {
  cursor: pointer;
  font-weight: 700;
}

.how ol {
  padding-left: 1.2em;
}

.how-math {
  white-space: pre-line;
  padding: 10px;
  border-radius: 10px;
  background: var(--brand-soft);
  font-size: 14px;
  line-height: 1.9;
}

.how-note {
  color: var(--muted);
  font-size: 13px;
}

/* 下部固定バー */
.sticky-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-around;
  gap: 6px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 2px solid var(--brand);
  box-shadow: 0 -4px 14px rgba(36, 31, 46, 0.12);
}

.sticky-bar span {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
}

.sticky-bar small {
  color: var(--muted);
  font-size: 11px;
}

.sticky-bar b {
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}

.sticky-total b {
  color: var(--brand);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: 14px;
  font-weight: 700;
  box-shadow: var(--shadow);
  z-index: 10;
}

/* ===== はじめて使う人への登録画面 ===== */
body.gate-open {
  overflow: hidden;
}

.gate {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
  overflow-y: auto;
  background: rgba(22, 16, 34, 0.72);
  backdrop-filter: blur(3px);
}

.gate-card {
  width: 100%;
  max-width: 460px;
  margin: auto;
  padding: 18px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}

.gate-lang {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.gate-lang-btn {
  min-height: 34px;
  padding: 4px 16px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.gate-lang-btn[aria-pressed="true"] {
  border-color: var(--brand);
  background: var(--brand);
  color: var(--brand-ink);
}

.gate-title {
  margin: 0;
  font-size: 20px;
  text-wrap: balance;
}

.gate-lead {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.gate-q {
  margin: 6px 0 0;
  font-size: 15px;
}

.gate-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.gate-option {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 66px;
  padding: 10px 8px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.gate-option strong {
  font-size: 15px;
}

.gate-option small {
  font-size: 11px;
}

.gate-option[aria-pressed="true"] {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--ink);
}

.gate-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gate-label {
  font-size: 14px;
  font-weight: 700;
}

.gate-hint {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.gate-ig {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gate-at {
  font-size: 20px;
  font-weight: 800;
  color: var(--muted);
}

.gate-purpose {
  margin: 0;
  padding: 10px;
  border-radius: 10px;
  background: var(--brand-soft);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.gate-consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
}

.gate-consent input {
  width: 24px;
  height: 24px;
  flex: none;
  margin: 0;
  accent-color: var(--brand);
}

.gate-error {
  margin: 0;
  padding: 10px;
  border-radius: 10px;
  background: var(--brand-soft);
  color: var(--danger);
  font-size: 14px;
  font-weight: 700;
}

.gate-submit {
  min-height: 54px;
  border: none;
  border-radius: 12px;
  background: var(--brand);
  color: var(--brand-ink);
  font: inherit;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.gate-submit:disabled {
  opacity: 0.6;
  cursor: progress;
}

.gate-contact {
  margin: 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.gate-option:focus-visible,
.gate-lang-btn:focus-visible,
.gate-submit:focus-visible,
.gate-consent input:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

/* 登録情報の確認・削除 */
.manage {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}

.manage-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.manage-who {
  margin: 4px 0 8px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.manage-del {
  min-height: 40px;
  padding: 4px 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--danger);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="header">
      <h1 data-i18n="app.title">🎨 カラー剤 計算機</h1>
      <p data-i18n="app.tagline">タップするだけ。1剤のグラム数を自動で出します。</p>
      <div class="lang" id="lang-switch" role="group" data-i18n-aria="lang.aria"></div>
    </header>

    <main class="main">
      <!-- 計算のむき -->
      <div class="tabs" role="tablist" data-i18n-aria="tabs.aria">
        <button class="tab" role="tab" data-mode="total" aria-selected="true">
          <strong data-i18n="tab.total.title">合計量からきめる</strong>
          <small data-i18n="tab.total.sub">ぜんぶで◯g つくりたい</small>
        </button>
        <button class="tab" role="tab" data-mode="base" aria-selected="false">
          <strong data-i18n="tab.base.title">1剤の量からきめる</strong>
          <small data-i18n="tab.base.sub">1剤を◯g 使いたい</small>
        </button>
      </div>

      <!-- STEP 1 -->
      <section class="card">
        <h2 class="step">
          <span class="step-no">1</span><span data-i18n="step1.title">2剤のわりあい</span>
        </h2>
        <p class="hint" data-i18n="step1.hint">1剤 1 に対して、2剤（オキシ）を何倍いれる？</p>
        <div class="chips" id="ratio-chips"></div>
        <div class="custom-row">
          <label for="ratio-custom" data-i18n="step1.custom">その他の倍率</label>
          <div class="stepper">
            <button type="button" class="round" data-act="ratio-minus" data-i18n-aria="step1.aria.minus">−</button>
            <input
              id="ratio-custom"
              class="num-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.5"
              data-i18n-aria="step1.aria.input"
            />
            <button type="button" class="round" data-act="ratio-plus" data-i18n-aria="step1.aria.plus">＋</button>
          </div>
        </div>
        <p class="ratio-view">
          <span data-i18n="step1.ratioLabel">1剤 : 2剤 ＝ </span><b id="ratio-view">1 : 1</b>
        </p>
      </section>

      <!-- STEP 2（合計量モードのみ） -->
      <section class="card" id="total-card">
        <h2 class="step">
          <span class="step-no">2</span><span data-i18n="step2.title">ぜんぶで何g つくる？</span>
        </h2>

  var listeners = [];

  /** 端末の言語設定から初期言語を決める */
  function detect(languages) {
    var list = languages || [];
    for (var i = 0; i < list.length; i++) {
      var tag = String(list[i]).toLowerCase();
      if (tag.indexOf("yue") === 0 || tag.indexOf("zh") === 0) return "yue";
      if (tag.indexOf("ja") === 0) return "ja";
    }
    return "ja";
  }

  function has(lang) {
    return order.indexOf(lang) >= 0;
  }

  /** キーを引いて {name} を差し替える。未定義キーは日本語 → キー名の順にフォールバック */
  function translate(lang, key, params) {
    var dict = dictionaries[has(lang) ? lang : "ja"];
    var text = dict[key];
    if (text === undefined) text = ja[key];
    if (text === undefined) return key;
    if (!params) return text;
    return text.replace(/\{(\w+)\}/g, function (match, name) {
      return Object.prototype.hasOwnProperty.call(params, name)
        ? String(params[name])
        : match;
    });
  }

  function readStored() {
    try {
      return JSON.parse(localStorage.getItem(LANG_KEY));
    } catch (e) {
      return null;
    }
  }

  /** いま使う言語。保存済み → 端末の言語設定 → 日本語 の順に決まる */
  function current() {
    if (currentLang) return currentLang;
    var saved = readStored();
    currentLang = has(saved)
      ? saved
      : detect(
          (typeof navigator !== "undefined" &&
            (navigator.languages || [navigator.language])) ||
            []
        );
    return currentLang;
  }

  /** 言語を切り替えて、購読側（画面・登録フォーム）に知らせる */
  function set(lang) {
    if (!has(lang) || lang === current()) return;
    currentLang = lang;
    try {
      localStorage.setItem(LANG_KEY, JSON.stringify(lang));
    } catch (e) {
      /* 保存できなくても切り替えは効く */
    }
    listeners.forEach(function (fn) {
      fn(currentLang);
    });
  }

  function onChange(fn) {
    listeners.push(fn);
  }

  /** その言語で引く t() を作る */
  function scoped(getLang) {
    return function (key, params) {
      return translate(getLang(), key, params);
    };
  }

  return {
    LANGS: order,
    dictionaries: dictionaries,
    detect: detect,
    has: has,
    translate: translate,
    current: current,
    set: set,
    onChange: onChange,
    scoped: scoped,
  };
});

      controls.appendChild(minus);
      controls.appendChild(value);
      controls.appendChild(plus);

      if (!isTotal) {
        var unit = document.createElement("span");
        unit.className = "unit";
        unit.textContent = "g";
        controls.appendChild(unit);
      }

      var badge = document.createElement("span");
      badge.className = "item-badge";
      badge.textContent = "-";
      if (!isTotal) badge.style.display = "none";
      controls.appendChild(badge);

      row.appendChild(controls);
      itemsEl.appendChild(row);
      rows.push({ badge: badge });
    });
  }

  $("add-item").addEventListener("click", function () {
    if (state.items.length >= 12) return;
    state.items.push({ name: "", parts: 1, grams: 10 });
    renderItems();
    update();
  });

  /* ---------- 結果 ---------- */

  function itemLabel(item, index) {
    return item && item.name && item.name.trim()
      ? item.name
      : t("item.fallback", { n: index + 1 });
  }

  function resultRow(name, sub, grams, className) {
    var row = document.createElement("div");
    row.className = "rrow" + (className ? " " + className : "");

    var left = document.createElement("div");
    left.className = "rname";
    left.appendChild(document.createTextNode(name));
    if (sub) {
      var small = document.createElement("small");
      small.textContent = sub;
      left.appendChild(small);
    }

    var right = document.createElement("div");
    right.className = "rgram";
    right.appendChild(document.createTextNode(grams));
    var unit = document.createElement("span");
    unit.textContent = "g";
    right.appendChild(unit);

    row.appendChild(left);
    row.appendChild(right);
    return row;
  }

  function renderResult(result) {
    resultBody.textContent = "";

    if (!result.ok) {
      var err = document.createElement("p");
      err.className = "error";
      err.textContent = "⚠ " + t("err." + result.code);
      resultBody.appendChild(err);
      return;
    }

    var step = result.step;
    var partsSum = result.items.reduce(function (a, row) {
      return a + row.parts;
    }, 0);

    result.items.forEach(function (row, index) {
      var sub = "";
      if (state.mode === "total" && result.items.length > 1 && partsSum > 0) {
        sub = t("result.partsSub", {
          parts: row.parts,
          pct: Math.round((row.parts / partsSum) * 100),
        });
      }
      resultBody.appendChild(
        resultRow(itemLabel(state.items[index], index), sub, row.text, "")
      );
    });

    if (result.items.length > 1) {
      var subtotal = document.createElement("p");
      subtotal.className = "subtotal";
      subtotal.textContent = t("result.subtotal", {
        g: CM.formatGrams(result.base1, step),
      });
      resultBody.appendChild(subtotal);
    }

    resultBody.appendChild(
      resultRow(
        t("result.ox"),
        t("result.oxSub", { r: result.oxRatio }),
        CM.formatGrams(result.ox, step),
        "ox"
      )
    );
    resultBody.appendChild(
      resultRow(t("result.sum"), "", CM.formatGrams(result.total, step), "sum")
    );

    if (result.adjusted) {
      var notice = document.createElement("p");
      notice.className = "notice";
      notice.textContent = t("result.notice", {
        req: result.requestedTotal,
        step: step < 1 ? "0.1g" : "1g",
        got: CM.formatGrams(result.total, step),
      });
      resultBody.appendChild(notice);
    }
  }

  function buildStepToggle() {
    var wrap = document.createElement("div");
    wrap.className = "steps-toggle";
    var label = document.createElement("span");
    label.className = "steps-label";
    wrap.appendChild(label);

    CM.STEPS.forEach(function (step) {
      var chip = button("chip", "");
      chip.dataset.step = String(step);
      chip.addEventListener("click", function () {
        state.step = step;
        syncStep();
        update();
      });
      wrap.appendChild(chip);
    });

    resultCard.appendChild(wrap);
    stepToggle = wrap;
  }

  function syncStep() {
    if (!stepToggle) return;
    Array.prototype.forEach.call(stepToggle.querySelectorAll(".chip"), function (chip) {
      chip.setAttribute(
        "aria-pressed",
        Number(chip.dataset.step) === state.step ? "true" : "false"
      );
    });
  }

  function renderBadges(result) {
    rows.forEach(function (row, index) {
      if (state.mode !== "total") return;
      var value = result.ok && result.items[index] ? result.items[index].text + "g" : "-";
      row.badge.textContent = value;
    });
  }

  function renderSticky(result) {
    if (!result.ok) {
      stickyBar.hidden = true;
      return;
    }
    stickyBar.hidden = resultVisible;
    var step = result.step;
    $("sticky-base").textContent = CM.formatGrams(result.base1, step) + "g";
    $("sticky-ox").textContent = CM.formatGrams(result.ox, step) + "g";
    $("sticky-total").textContent = CM.formatGrams(result.total, step) + "g";
  }

  /* 結果カードが画面から外れているときだけ下部バーを出す */
  var resultVisible = true;

  function watchResultCard() {
    if (!("IntersectionObserver" in window)) return;
    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          resultVisible = entry.isIntersecting;
          stickyBar.hidden = resultVisible || !lastResult.ok;
        });
      },
      { threshold: 0.25 }
    );
    observer.observe(resultCard);
  }

  /* ---------- コピー・保存・リセット ---------- */

  function resultText(result) {
    if (!result.ok) return "";
    var step = result.step;
    var lines = [t("copy.header"), t("copy.ratio") + CM.formatRatio(result.oxRatio), ""];
    result.items.forEach(function (row, index) {
      lines.push(itemLabel(state.items[index], index) + "  " + row.text + "g");
    });
    lines.push("--------------------");
    if (result.items.length > 1) {
      lines.push(t("copy.subtotal") + "  " + CM.formatGrams(result.base1, step) + "g");
    }
    lines.push(t("copy.ox") + "  " + CM.formatGrams(result.ox, step) + "g");
    lines.push(t("copy.total") + "  " + CM.formatGrams(result.total, step) + "g");
    return lines.join("\n");
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () {
          toast(t("toast.copied"));
        },
        function () {
          fallbackCopy(text);
        }
      );
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(area);
    toast(t(ok ? "toast.copied" : "toast.copy_failed"));
  }

  $("copy-btn").addEventListener("click", function () {
    var text = resultText(lastResult);
    if (!text) {
      toast(t("toast.need_input"));
      return;
    }
    copyText(text);
  });

  function recipeSummary(saved) {
    var names = saved.state.items
      .map(function (item, index) {
        return itemLabel(item, index);
      })
      .join(" / ");
    return CM.formatRatio(saved.state.oxRatio) + "　" + names;
  }

  $("save-btn").addEventListener("click", function () {
    var suggestion = itemLabel(state.items[0], 0);
    var name = window.prompt(t("prompt.save"), suggestion);
    if (name === null) return;
    name = name.trim() || suggestion;
    recipes.unshift({ name: name, state: JSON.parse(JSON.stringify(state)) });
    recipes = recipes.slice(0, 30);
    writeStore(RECIPE_KEY, recipes);
    renderRecipes();
    toast(t("toast.saved"));
  });

  function renderRecipes() {
    recipesEl.textContent = "";
    recipesCard.hidden = recipes.length === 0;

    recipes.forEach(function (saved, index) {
      var row = document.createElement("div");
      row.className = "recipe";

      var load = button("recipe-load", "");
      load.appendChild(document.createTextNode(saved.name));
      var small = document.createElement("small");
      small.textContent = recipeSummary(saved);
      load.appendChild(small);
      load.addEventListener("click", function () {
        state = sanitize(saved.state);
        syncAll();
        toast(t("toast.loaded"));
      });

      var del = button("del-btn", "✕");
      del.setAttribute("aria-label", t("recipe.aria.del", { name: saved.name }));
      del.addEventListener("click", function () {
        recipes.splice(index, 1);
        writeStore(RECIPE_KEY, recipes);
        renderRecipes();
      });

      row.appendChild(load);
      row.appendChild(del);
      recipesEl.appendChild(row);
    });
  }

  $("reset-btn").addEventListener("click", function () {
    if (!window.confirm(t("confirm.reset"))) return;
    state = defaultState();
    syncAll();
  });

  var toastTimer = null;
  function toast(message) {
    var existing = document.querySelector(".toast");
    if (existing) existing.remove();
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.remove();
    }, 1800);
  }

  /* ---------- 更新 ---------- */

  var lastResult = { ok: false };

  function update() {
    lastResult = CM.calc(state);
    renderResult(lastResult);
    renderBadges(lastResult);
    renderSticky(lastResult);
    writeStore(STATE_KEY, state);
  }

  function syncAll() {
    ratioCustom.value = String(state.oxRatio);
    totalInput.value = String(state.total);
    syncMode();
    syncRatio();
    syncTotal();
    syncStep();
    renderItems();
    renderRecipes();
    update();
  }

  I18N.onChange(function () {
    applyLang();
    syncAll();
  });

  buildStepToggle();
  applyLang();
  syncAll();
  watchResultCard();
})();

    <script>
/**
 * はじめて使う人だけに出す利用登録。
 *
 * ・所属（サロン / フリーランス）と Instagram を聞いてから計算機を使えるようにする
 * ・一度登録したら二度と出さない（端末の localStorage に記録）
 * ・送信先は config.js の register.mode で切り替える
 */
(function () {
  "use strict";

  var I18N = window.ColorMixI18N;
  var Profile = window.ColorMixProfile;
  var PROFILE_KEY = "colormix.profile.v1";

  var defaults = {
    mode: "local",
    apiUrl: "/api/register",
    form: { actionUrl: "", fields: {} },
    contact: "",
  };
  var config = Object.assign(
    {},
    defaults,
    (window.COLORMIX_CONFIG && window.COLORMIX_CONFIG.register) || {}
  );

  var t = I18N.scoped(I18N.current);

  /* ---------- 保存 ---------- */

  function readProfile() {
    try {
      var raw = localStorage.getItem(PROFILE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      return parsed && parsed.instagram ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function writeProfile(profile) {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch (e) {
      /* 保存できなくても使えるようにはする */
    }
  }

  function clearProfile() {
    try {
      localStorage.removeItem(PROFILE_KEY);
    } catch (e) {
      /* noop */
    }
  }

  /* ---------- 送信 ---------- */

  function collects() {
    return config.mode === "api" || config.mode === "form";
  }

  /** 送信できたら true。失敗しても例外は投げない */
  function send(record) {
    if (config.mode === "api") {
      return fetch(config.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record),
      }).then(function (response) {
        return response.ok;
      });
    }

    if (config.mode === "form" && config.form && config.form.actionUrl) {
      var body = new FormData();
      var fields = config.form.fields || {};
      Object.keys(fields).forEach(function (key) {
        if (fields[key]) body.append(fields[key], record[key] || "");
      });
      // Google フォームは CORS を返さないので結果は読めない。送れたら成功とみなす
      return fetch(config.form.actionUrl, {
        method: "POST",
        mode: "no-cors",
        body: body,
      }).then(function () {
        return true;
      });
    }

    return Promise.resolve(false);
  }

  function trySend(record) {
    if (!collects()) return Promise.resolve(false);
    return send(record).catch(function () {
      return false;
    });
  }

  /** 前回送れなかった分をこっそり送りなおす */
  function retryPending() {
    var profile = readProfile();
    if (!profile || profile.synced || !collects()) return;
    trySend(Profile.buildRecord(profile, profile)).then(function (sent) {
      if (!sent) return;
      profile.synced = true;
      writeProfile(profile);
      renderManage();
    });
  }

  /* ---------- 画面の下ごしらえ ---------- */

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  var backdrop = null;
  var state = { affiliation: "", consent: false, busy: false };
  var refs = {};

  var pageParts = function () {
    return [
      document.querySelector(".header"),
      document.querySelector(".main"),
      document.getElementById("sticky-bar"),
    ].filter(Boolean);
  };

  function setPageInert(on) {
    pageParts().forEach(function (part) {
      if (on) {
        part.setAttribute("inert", "");
        part.setAttribute("aria-hidden", "true");
      } else {
        part.removeAttribute("inert");
        part.removeAttribute("aria-hidden");
      }
    });
    document.body.classList.toggle("gate-open", on);
  }

  /* ---------- 登録画面 ---------- */

  function buildGate() {
    backdrop = el("div", "gate");
    backdrop.setAttribute("role", "dialog");
    backdrop.setAttribute("aria-modal", "true");

    var card = el("div", "gate-card");
    backdrop.appendChild(card);

    // 言語切り替え（登録画面が最初に出るので、ここにも要る）
    var langRow = el("div", "gate-lang");
    langRow.setAttribute("role", "group");
    refs.langButtons = I18N.LANGS.map(function (code) {
      var btn = el("button", "gate-lang-btn", I18N.translate(code, "lang.name"));
      btn.type = "button";
      btn.addEventListener("click", function () {
        I18N.set(code);
      });
      langRow.appendChild(btn);
      return { code: code, btn: btn };
    });
    card.appendChild(langRow);

    refs.title = el("h2", "gate-title");
    refs.title.id = "gate-title";
    backdrop.setAttribute("aria-labelledby", "gate-title");
    card.appendChild(refs.title);

    refs.lead = el("p", "gate-lead");
    card.appendChild(refs.lead);

    // 所属
    refs.q1 = el("h3", "gate-q");
    card.appendChild(refs.q1);
    var options = el("div", "gate-options");
    refs.options = Profile.AFFILIATIONS.map(function (value) {
      var btn = el("button", "gate-option");
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      var strong = el("strong");
      var small = el("small");
      btn.appendChild(strong);
      btn.appendChild(small);
      btn.addEventListener("click", function () {
        state.affiliation = value;
        syncOptions();
        clearError();
      });
      options.appendChild(btn);
      return { value: value, btn: btn, strong: strong, small: small };
    });
    card.appendChild(options);

    // サロン名（サロン所属のときだけ）
    refs.salonWrap = el("div", "gate-field");
    refs.salonLabel = el("label", "gate-label");
    refs.salonLabel.htmlFor = "gate-salon";
    refs.salon = el("input", "text-input");
    refs.salon.id = "gate-salon";
    refs.salon.type = "text";
    refs.salon.maxLength = Profile.SALON_MAX;
    refs.salonWrap.appendChild(refs.salonLabel);
    refs.salonWrap.appendChild(refs.salon);
    card.appendChild(refs.salonWrap);

    // Instagram
    var igWrap = el("div", "gate-field");
    refs.igLabel = el("label", "gate-label");
    refs.igLabel.htmlFor = "gate-instagram";
    refs.igHint = el("p", "gate-hint");
    var igRow = el("div", "gate-ig");
    igRow.appendChild(el("span", "gate-at", "@"));
    refs.instagram = el("input", "text-input");
    refs.instagram.id = "gate-instagram";
    refs.instagram.type = "text";
    refs.instagram.autocapitalize = "off";
    refs.instagram.autocomplete = "off";
    refs.instagram.spellcheck = false;
    refs.instagram.addEventListener("input", clearError);
    igRow.appendChild(refs.instagram);
    igWrap.appendChild(refs.igLabel);
    igWrap.appendChild(refs.igHint);
    igWrap.appendChild(igRow);
    card.appendChild(igWrap);

    // 使いみち＋同意
    refs.purpose = el("p", "gate-purpose");
    card.appendChild(refs.purpose);

    var consentRow = el("label", "gate-consent");
    refs.consent = document.createElement("input");
    refs.consent.type = "checkbox";
    refs.consent.addEventListener("change", function () {
      state.consent = refs.consent.checked;
      clearError();
    });
    refs.consentText = el("span");
    consentRow.appendChild(refs.consent);
    consentRow.appendChild(refs.consentText);
    card.appendChild(consentRow);

    refs.error = el("p", "gate-error");
    refs.error.setAttribute("role", "alert");
    refs.error.hidden = true;
    card.appendChild(refs.error);

    refs.submit = el("button", "gate-submit");
    refs.submit.type = "button";
    refs.submit.addEventListener("click", onSubmit);
    card.appendChild(refs.submit);

    refs.contact = el("p", "gate-contact");
    card.appendChild(refs.contact);

    // タブ移動をカードの中だけに閉じ込める
    backdrop.addEventListener("keydown", function (event) {
      if (event.key !== "Tab") return;
      var focusable = card.querySelectorAll(
        'button, input, [href], select, textarea, [tabindex]:not([tabindex="-1"])'
      );
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    document.body.appendChild(backdrop);
    applyGateText();
    syncOptions();
    setPageInert(true);
    refs.options[0].btn.focus();
  }

  function applyGateText() {
    if (!backdrop) return;
    refs.title.textContent = t("reg.title");
    refs.lead.textContent = t("reg.lead");
    refs.q1.textContent = t("reg.q1");
    refs.options.forEach(function (option) {
      option.strong.textContent = t("reg.opt." + option.value);
      option.small.textContent = t("reg.opt." + option.value + ".sub");
    });
    refs.salonLabel.textContent = t("reg.salonName");
    refs.salon.placeholder = t("reg.salonName.ph");
    refs.igLabel.textContent = t("reg.q2");
    refs.igHint.textContent = t("reg.q2.hint");
    refs.instagram.placeholder = t("reg.instagram.ph");
    refs.instagram.setAttribute("aria-label", t("reg.q2"));
    refs.purpose.textContent = t(collects() ? "reg.purpose.collect" : "reg.purpose.local");
    refs.consentText.textContent = t("reg.consent");
    refs.submit.textContent = t(state.busy ? "reg.submitting" : "reg.submit");
    refs.contact.textContent = config.contact
      ? t("reg.contact", { contact: config.contact })
      : "";
    refs.contact.hidden = !config.contact;
    I18N.LANGS.forEach(function (code, index) {
      refs.langButtons[index].btn.setAttribute(
        "aria-pressed",
        code === I18N.current() ? "true" : "false"
      );
    });
    if (refs.error.dataset.code) {
      refs.error.textContent = t("reg.err." + refs.error.dataset.code);
    }
  }

  function syncOptions() {
    refs.options.forEach(function (option) {
      option.btn.setAttribute(
        "aria-pressed",
        option.value === state.affiliation ? "true" : "false"
      );
    });
    refs.salonWrap.hidden = state.affiliation !== "salon";
  }

  function clearError() {
    refs.error.hidden = true;
    refs.error.textContent = "";
    delete refs.error.dataset.code;
  }

  function showError(code, field) {
    refs.error.dataset.code = code;
    refs.error.textContent = t("reg.err." + code);
    refs.error.hidden = false;
    if (field && field.focus) field.focus();
  }

  function onSubmit() {
    if (state.busy) return;

    var result = Profile.validate({
      affiliation: state.affiliation,
      salon: refs.salon.value,
      instagram: refs.instagram.value,
      consent: state.consent,
    });

    if (!result.ok) {
      if (result.errors.affiliation) {
        showError(result.errors.affiliation, refs.options[0].btn);
      } else if (result.errors.instagram) {
        showError(result.errors.instagram, refs.instagram);
      } else {
        showError(result.errors.consent, refs.consent);
      }
      return;
    }

    state.busy = true;
    refs.submit.disabled = true;
    refs.submit.textContent = t("reg.submitting");

    var record = Profile.buildRecord(result.value, {
      lang: I18N.current(),
      registeredAt: new Date().toISOString(),
    });

    trySend(record).then(function (sent) {
      var profile = Object.assign({}, record, { synced: sent || !collects() });
      writeProfile(profile);
      closeGate();
      renderManage();
      if (collects() && !sent) notify(t("reg.warn.offline"));
    });
  }

  function closeGate() {
    if (!backdrop) return;
    backdrop.remove();
    backdrop = null;
    state.busy = false;
    setPageInert(false);
  }

  /** 画面下に短く出すお知らせ（app.js のトーストと同じ見た目） */
  function notify(message) {
    var existing = document.querySelector(".toast");
    if (existing) existing.remove();
    var toast = el("div", "toast", message);
    document.body.appendChild(toast);
    setTimeout(function () {
      toast.remove();
    }, 2600);
  }

  /* ---------- 登録情報の確認・削除 ---------- */

  function renderManage() {
    var host = document.getElementById("reg-manage");
    if (!host) return;
    host.textContent = "";

    var profile = readProfile();
    if (!profile) {
      host.hidden = true;
      return;
    }
    host.hidden = false;

    var title = el("p", "manage-title", t("reg.manage.title"));
    var who = el(
      "p",
      "manage-who",
      t("reg.aff." + profile.affiliation) +
        "・@" +
        profile.instagram +
        (profile.salon ? "・" + profile.salon : "") +
        (profile.synced ? "" : t("reg.manage.pending"))
    );
    var del = el("button", "manage-del", t("reg.manage.delete"));
    del.type = "button";
    del.addEventListener("click", function () {
      clearProfile();
      renderManage();
      notify(t("reg.manage.deleted"));
    });

    host.appendChild(title);
    host.appendChild(who);
    host.appendChild(del);
  }

  /* ---------- 起動 ---------- */

  I18N.onChange(function () {
    applyGateText();
    renderManage();
  });

  if (config.mode !== "off" && !readProfile()) {
    buildGate();
  } else {
    retryPending();
  }
  renderManage();

  window.ColorMixRegister = {
    getProfile: readProfile,
    clearProfile: clearProfile,
    collects: collects,
  };
})();
