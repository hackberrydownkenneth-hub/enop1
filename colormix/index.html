<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="DRIVE BLUE HONG KONG がお届けする美容師向けツール。合計量と2剤の倍率を入れるだけで、1剤それぞれのグラム数を自動計算します。日本語・廣東話対応。"
    />
    <title>カラー剤 計算機</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="header">
      <p class="brand">
        <span class="brand-logo" role="img" aria-label="DRIVE BLUE HONG KONG"></span>
      </p>
      <h1 data-i18n="app.title">🎨 カラー剤 計算機</h1>
      <p data-i18n="app.tagline">タップするだけ。1剤のグラム数を自動で出します。</p>
      <div class="lang" id="lang-switch" role="group" data-i18n-aria="lang.aria"></div>
    </header>

    <main class="main">
      <!-- 計算のむき -->
      <div class="tabs" role="tablist" data-i18n-aria="tabs.aria">
        <button class="tab" role="tab" data-mode="total" aria-selected="true">
          <strong data-i18n="tab.total.title">合計量からきめる</strong>
          <small data-i18n="tab.total.sub">ぜんぶで◯g つくりたい</small>
        </button>
        <button class="tab" role="tab" data-mode="base" aria-selected="false">
          <strong data-i18n="tab.base.title">1剤の量からきめる</strong>
          <small data-i18n="tab.base.sub">1剤を◯g 使いたい</small>
        </button>
      </div>

      <!-- STEP 1 -->
      <section class="card">
        <h2 class="step">
          <span class="step-no">1</span><span data-i18n="step1.title">2剤のわりあい</span>
        </h2>
        <p class="hint" data-i18n="step1.hint">1剤 1 に対して、2剤（オキシ）を何倍いれる？</p>
        <div class="chips" id="ratio-chips"></div>
        <div class="custom-row">
          <label for="ratio-custom" data-i18n="step1.custom">その他の倍率</label>
          <div class="stepper">
            <button type="button" class="round" data-act="ratio-minus" data-i18n-aria="step1.aria.minus">−</button>
            <input
              id="ratio-custom"
              class="num-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.5"
              data-i18n-aria="step1.aria.input"
            />
            <button type="button" class="round" data-act="ratio-plus" data-i18n-aria="step1.aria.plus">＋</button>
          </div>
        </div>
        <p class="ratio-view">
          <span data-i18n="step1.ratioLabel">1剤 : 2剤 ＝ </span><b id="ratio-view">1 : 1</b>
        </p>
      </section>

      <!-- STEP 2（合計量モードのみ） -->
      <section class="card" id="total-card">
        <h2 class="step">
          <span class="step-no">2</span><span data-i18n="step2.title">ぜんぶで何g つくる？</span>
        </h2>
        <p class="hint" data-i18n="step2.hint">1剤と2剤をまぜたあとの合計量です。</p>
        <div class="chips" id="total-chips"></div>
        <div class="custom-row">
          <label for="total-input" data-i18n="step2.label">合計量</label>
          <div class="stepper">
            <button type="button" class="round" data-act="total-minus" data-i18n-aria="step2.aria.minus">−</button>
            <input
              id="total-input"
              class="num-input big"
              type="number"
              inputmode="decimal"
              min="0"
              step="10"
              data-i18n-aria="step2.aria.input"
            />
            <span class="unit">g</span>
            <button type="button" class="round" data-act="total-plus" data-i18n-aria="step2.aria.plus">＋</button>
          </div>
        </div>
      </section>

      <!-- STEP 3 -->
      <section class="card">
        <h2 class="step">
          <span class="step-no" id="items-step-no">3</span><span id="items-title">1剤のミックス</span>
        </h2>
        <p class="hint" id="items-hint">
          まぜる1剤の「わりあい」を入れてください（例 2 : 1）。1種類だけならそのままでOK。
        </p>
        <div id="items"></div>
        <button type="button" class="add-btn" id="add-item" data-i18n="items.add">＋ 1剤をふやす</button>
      </section>

      <!-- けっか -->
      <section class="card result" id="result-card" aria-live="polite">
        <h2 class="result-title" data-i18n="result.title">はかる量</h2>
        <div id="result-body"></div>
      </section>

      <div class="actions">
        <button type="button" class="action" id="copy-btn" data-i18n="action.copy">📋 コピー</button>
        <button type="button" class="action" id="save-btn" data-i18n="action.save">⭐ レシピ保存</button>
        <button type="button" class="action" id="reset-btn" data-i18n="action.reset">↺ リセット</button>
      </div>

      <section class="card recipes" id="recipes-card" hidden>
        <h2 class="step">
          <span class="step-no">★</span><span data-i18n="recipes.title">保存したレシピ</span>
        </h2>
        <div id="recipes"></div>
      </section>

      <details class="card how">
        <summary data-i18n="how.summary">つかいかた・計算のしくみ</summary>
        <ol>
          <li data-i18n="how.step1"></li>
          <li data-i18n="how.step2"></li>
          <li data-i18n="how.step3"></li>
        </ol>
        <p class="how-math" data-i18n="how.math"></p>
        <p class="how-note" data-i18n="how.note1"></p>
        <p class="how-note" data-i18n="how.note2"></p>
        <div class="manage" id="reg-manage" hidden></div>
      </details>
      <footer class="footer">
        <span class="footer-by" data-i18n="footer.by">提供</span>
        <span class="brand brand-footer">
          <span class="brand-logo" role="img" aria-label="DRIVE BLUE HONG KONG"></span>
        </span>
        <a class="footer-contact" id="footer-contact" hidden></a>
      </footer>
    </main>

    <div class="sticky-bar" id="sticky-bar" hidden>
      <span><small data-i18n="sticky.base">1剤</small><b id="sticky-base">-</b></span>
      <span><small data-i18n="sticky.ox">2剤</small><b id="sticky-ox">-</b></span>
      <span class="sticky-total"><small data-i18n="sticky.total">合計</small><b id="sticky-total">-</b></span>
    </div>

    <script src="i18n.js"></script>
    <script src="calc.js"></script>
    <script src="profile.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="register.js"></script>
  </body>
</html>
